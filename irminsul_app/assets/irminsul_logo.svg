<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="tg" x1="60" y1="28" x2="60" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fg" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="core" cx="60" cy="82" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cadre sigil (hexagone) -->
  <path d="M60 10 L105 35 L105 85 L60 110 L15 85 L15 35 Z"
        stroke="url(#fg)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <path d="M60 18 L98 39 L98 81 L60 102 L22 81 L22 39 Z"
        stroke="url(#fg)" stroke-width="1" stroke-linejoin="round" opacity="0.30"/>

  <!-- lueur de base -->
  <circle cx="60" cy="82" r="18" fill="url(#core)"/>

  <!-- arbre : tronc, branches maitresses, canopee fournie (organique) -->
  <g stroke="url(#tg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 90 L60 60"/>
    <path d="M60 63 Q 50 57 42 50"/>
    <path d="M60 63 Q 70 57 78 50"/>
    <path d="M60 60 C 59 54 60 50 60 46"/>
  </g>
  <g stroke="url(#tg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- canopee gauche -->
    <path d="M42 50 Q 35 45 31 39"/>
    <path d="M42 50 Q 40 43 40 35"/>
    <path d="M42 50 Q 46 45 48 39"/>
    <!-- canopee centre -->
    <path d="M60 46 Q 55 40 53 35"/>
    <path d="M60 46 Q 60 38 60 30"/>
    <path d="M60 46 Q 65 40 67 35"/>
    <!-- canopee droite -->
    <path d="M78 50 Q 85 45 89 39"/>
    <path d="M78 50 Q 80 43 80 35"/>
    <path d="M78 50 Q 74 45 72 39"/>
    <!-- racines -->
    <path d="M60 90 L51 97"/>
    <path d="M60 90 L69 97"/>
  </g>

  <!-- halos de noeuds -->
  <g fill="#22D3EE" opacity="0.16">
    <circle cx="31" cy="39" r="4.2"/><circle cx="40" cy="35" r="4.2"/><circle cx="48" cy="39" r="4.2"/>
    <circle cx="53" cy="35" r="4.2"/><circle cx="60" cy="30" r="5"/><circle cx="67" cy="35" r="4.2"/>
    <circle cx="89" cy="39" r="4.2"/><circle cx="80" cy="35" r="4.2"/><circle cx="72" cy="39" r="4.2"/>
    <circle cx="51" cy="97" r="3.6"/><circle cx="69" cy="97" r="3.6"/>
  </g>
  <!-- noeuds -->
  <g fill="#E9D5FF">
    <circle cx="31" cy="39" r="1.9"/><circle cx="40" cy="35" r="1.9"/><circle cx="48" cy="39" r="1.9"/>
    <circle cx="53" cy="35" r="1.9"/><circle cx="60" cy="30" r="2.4"/><circle cx="67" cy="35" r="1.9"/>
    <circle cx="89" cy="39" r="1.9"/><circle cx="80" cy="35" r="1.9"/><circle cx="72" cy="39" r="1.9"/>
    <circle cx="51" cy="97" r="1.6"/><circle cx="69" cy="97" r="1.6"/>
  </g>
  <!-- coeur -->
  <circle cx="60" cy="82" r="6" fill="#A78BFA" opacity="0.25"/>
  <circle cx="60" cy="82" r="3.6" fill="#FFFFFF"/>
</svg>
