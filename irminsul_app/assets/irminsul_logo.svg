<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="tg" x1="60" y1="26" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fg" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="core" cx="60" cy="80" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cadre sigil (hexagone) -->
  <path d="M60 10 L105 35 L105 85 L60 110 L15 85 L15 35 Z"
        stroke="url(#fg)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <path d="M60 18 L98 39 L98 81 L60 102 L22 81 L22 39 Z"
        stroke="url(#fg)" stroke-width="1" stroke-linejoin="round" opacity="0.32"/>

  <!-- lueur de base -->
  <circle cx="60" cy="80" r="18" fill="url(#core)"/>

  <!-- arbre (dendrite / data-tree) -->
  <g stroke="url(#tg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 86 L60 58"/>
    <path d="M60 62 Q 46 58 40 47"/>
    <path d="M60 62 Q 74 58 80 47"/>
    <path d="M60 58 L60 44"/>
    <path d="M40 47 L33 39"/>
    <path d="M40 47 L46 39"/>
    <path d="M80 47 L87 39"/>
    <path d="M80 47 L74 39"/>
    <path d="M60 44 L52 36"/>
    <path d="M60 44 L68 36"/>
    <path d="M60 44 L60 32"/>
    <path d="M60 86 L51 94"/>
    <path d="M60 86 L69 94"/>
  </g>

  <!-- halos de noeuds -->
  <g fill="#22D3EE" opacity="0.16">
    <circle cx="33" cy="39" r="4.5"/><circle cx="46" cy="39" r="4.5"/>
    <circle cx="87" cy="39" r="4.5"/><circle cx="74" cy="39" r="4.5"/>
    <circle cx="52" cy="36" r="4.5"/><circle cx="68" cy="36" r="4.5"/>
    <circle cx="60" cy="32" r="5"/>
    <circle cx="51" cy="94" r="4"/><circle cx="69" cy="94" r="4"/>
  </g>
  <!-- noeuds -->
  <g fill="#E9D5FF">
    <circle cx="33" cy="39" r="2"/><circle cx="46" cy="39" r="2"/>
    <circle cx="87" cy="39" r="2"/><circle cx="74" cy="39" r="2"/>
    <circle cx="52" cy="36" r="2"/><circle cx="68" cy="36" r="2"/>
    <circle cx="60" cy="32" r="2.4"/>
    <circle cx="51" cy="94" r="1.8"/><circle cx="69" cy="94" r="1.8"/>
  </g>
  <!-- coeur -->
  <circle cx="60" cy="80" r="6" fill="#A78BFA" opacity="0.25"/>
  <circle cx="60" cy="80" r="3.6" fill="#FFFFFF"/>
</svg>
