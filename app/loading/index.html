<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Irminsul — démarrage</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0B0D11; color:#c8d2dc; font:14px system-ui, sans-serif; }
  .box { text-align:center; max-width:520px; padding:24px; }
  .spin { width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
          border:3px solid #1d2733; border-top-color:#57c7d4;
          animation:s 0.9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  #err { display:none; color:#e07777; white-space:pre-wrap; text-align:left;
         background:#131820; border:1px solid #2a3442; border-radius:8px;
         padding:12px; margin-top:14px; font-family:ui-monospace, monospace; font-size:12px; }
  .dim { color:#66727f; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <div id="status" role="status">Démarrage du moteur local…</div>
    <div id="err"></div>
    <div class="dim">Serveur local (127.0.0.1 uniquement) — aucune donnée n'est envoyée en ligne.</div>
  </div>
  <script>
    // Appelé par Rust en cas d'échec de démarrage : erreur EXPLOITABLE, pas de fenêtre vide.
    window.__irmFail = function (msg) {
      document.getElementById("status").textContent = "Le démarrage a échoué.";
      var e = document.getElementById("err");
      e.style.display = "block";
      e.textContent = msg + "\n\nConsulte les logs : %APPDATA%/com.nylenia.irminsul/logs/next-server.log";
      document.querySelector(".spin").style.display = "none";
    };
  </script>
</body>
</html>
