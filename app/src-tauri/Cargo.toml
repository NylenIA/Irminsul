[package]
name = "irminsul"
version = "0.1.0"
description = "Irminsul — assistant Genshin Impact (desktop)"
authors = ["NylenIA"]
edition = "2021"
rust-version = "1.77"

# La logique réutilisable vit dans la lib ; main.rs ne fait que l'appeler.
[lib]
name = "irminsul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
serde_json = "1"
wait-timeout = "0.2"

[features]
# Évite l'ouverture d'une console au lancement en build release sous Windows.
default = []
