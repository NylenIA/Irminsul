name: desktop

# Build/validation de l'UI desktop.
# - frontend : validé localement ET en CI (Node).
# - tauri : compilation/linking validés EN CI (runner windows-latest = MSVC C++
#   Build Tools présents). En dev local sans VS Build Tools, `cargo check`/build
#   échouent au linker (cf. RISKS.md / docs/project) — la CI est la voie de validation.

on:
  push:
    paths: ["app/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Type-check (TS strict)
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  tauri:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - run: npm install --no-audit --no-fund
      - name: Tauri build (compilation + linking, sans bundler)
        run: npx tauri build --no-bundle
