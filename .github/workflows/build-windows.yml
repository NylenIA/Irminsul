name: Build Windows (Irminsul)

on:
  push:
    branches: [flutter-app]
    paths:
      - "irminsul_app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: irminsul_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate platform folders (windows/)
        run: flutter create --platforms=windows --project-name irminsul --org com.nylenia .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Bundle gcsim engine
        run: |
          Invoke-WebRequest -Uri "https://github.com/genshinsim/gcsim/releases/latest/download/gcsim_windows_amd64.exe" -OutFile "build/windows/x64/runner/Release/gcsim.exe"
          if ((Get-Item "build/windows/x64/runner/Release/gcsim.exe").Length -lt 1000000) { throw "gcsim.exe download failed" }

      - name: Package (zip)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Irminsul-windows.zip -Force

      # Livraison principale : GitHub Release « dev-latest » (pas de quota,
      # lien stable). L'artifact reste en secours avec rétention courte.
      - name: Publish dev release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev-latest --repo $env:GITHUB_REPOSITORY --prerelease --title "Irminsul (build de dev)" --notes "Dernier build de la branche flutter-app. Telecharge Irminsul-windows.zip, dezippe, lance irminsul.exe."
          }
          gh release upload dev-latest irminsul_app/Irminsul-windows.zip --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload artifact (secours)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Irminsul-windows
          path: irminsul_app/Irminsul-windows.zip
          retention-days: 3
          if-no-files-found: error
