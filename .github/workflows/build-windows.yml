name: Build Windows (Irminsul)

on:
  push:
    branches: [flutter-app]
    paths:
      - "irminsul_app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: irminsul_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate platform folders (windows/)
        run: flutter create --platforms=windows --project-name irminsul --org com.nylenia .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Setup Go (for gcsim engine)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Compilé depuis la DERNIÈRE source + PRs communautaires en attente :
      #   #2668 Varka (mainteneur core, merge propre)
      #   #2374 Iansan (adaptée via tool/patch_gcsim_iansan.py — fichiers déplacés)
      # Replis en cascade : sans Iansan -> main pur -> release officielle.
      - name: Build gcsim engine (latest source + community PRs)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "build/windows/x64/runner/Release/gcsim.exe"
          git clone --depth 50 https://github.com/genshinsim/gcsim gcsim-src
          Push-Location gcsim-src
          git config user.email "ci@irminsul.local"
          git config user.name "irminsul-ci"
          # --- PR Varka (#2668) ---
          git fetch --depth 50 origin pull/2668/head:pr-varka
          git merge pr-varka --no-edit
          if ($LASTEXITCODE -ne 0) { git merge --abort; Write-Host "varka: merge KO, skip" }
          Pop-Location
          # --- PR Iansan (#2374), adaptée au layout actuel ---
          gh pr diff 2374 --repo genshinsim/gcsim | Out-File -Encoding utf8 iansan.diff
          python tool/patch_gcsim_iansan.py gcsim-src iansan.diff
          $iansanOk = $LASTEXITCODE -eq 0
          if ($iansanOk) { python tool/check_keys_alignment.py gcsim-src; $iansanOk = $LASTEXITCODE -eq 0 }
          if (-not $iansanOk) {
            Write-Host "iansan: patch/alignement KO, retrait"
            Push-Location gcsim-src; git checkout -- .; git clean -fd internal/characters/iansan; Pop-Location
          }
          # --- build, avec replis ---
          Push-Location gcsim-src
          go build -o ../$out ./cmd/gcsim
          if ($LASTEXITCODE -ne 0 -and $iansanOk) {
            Write-Host "build KO avec iansan -> retrait et retry"
            git checkout -- .; git clean -fd internal/characters/iansan
            go build -o ../$out ./cmd/gcsim
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "build KO avec PRs -> main pur"
            git reset --hard origin/main; git clean -fd
            go build -o ../$out ./cmd/gcsim
          }
          Pop-Location
          if (-not (Test-Path $out)) {
            Write-Host "build source KO -> release officielle"
            Invoke-WebRequest -Uri "https://github.com/genshinsim/gcsim/releases/latest/download/gcsim_windows_amd64.exe" -OutFile $out
          }
          if ((Get-Item $out).Length -lt 1000000) { throw "gcsim.exe missing" }

      - name: Package (zip)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Irminsul-windows.zip -Force

      # Livraison principale : GitHub Release « dev-latest » (pas de quota,
      # lien stable). L'artifact reste en secours avec rétention courte.
      - name: Publish dev release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev-latest --repo $env:GITHUB_REPOSITORY --prerelease --title "Irminsul (build de dev)" --notes "Dernier build de la branche flutter-app. Telecharge Irminsul-windows.zip, dezippe, lance irminsul.exe."
          }
          gh release upload dev-latest Irminsul-windows.zip --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload artifact (secours)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Irminsul-windows
          path: irminsul_app/Irminsul-windows.zip
          retention-days: 3
          if-no-files-found: error
